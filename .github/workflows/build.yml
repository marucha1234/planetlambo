name: Sync site from production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'optimize.py'
      - '.github/workflows/build.yml'
  schedule:
    # Lunes 06:00 UTC: reespeja el sitio por si cambio el contenido
    - cron: '0 6 * * 1'

concurrency:
  group: sync-site
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync desde www.planetlambo.com
        run: python optimize.py

      - name: Commit de los archivos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync contenido desde www.planetlambo.com"
          git push
